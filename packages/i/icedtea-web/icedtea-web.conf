# Sourced by the icedtea-web launchers (java-functions); appends JVM flags.
# ITW jars go on the boot class path: JNLPPolicy trusts only code there or its own jar.
ADDITIONAL_FLAGS="-Xbootclasspath/a:$(build-classpath icedtea-web rhino tagsoup IPAddress commons-compress commons-io commons-lang3) -Dicedtea-web.bin.name=${0##*/} -Dicedtea-web.bin.location=$0 ${ADDITIONAL_FLAGS}"
set_javacmd
_itw_v=$("$JAVACMD" -version 2>&1 | sed -n '1s/.*version "\(1\.\)\{0,1\}\([0-9]*\).*/\2/p')
# --add-exports etc. are rejected by Java 8
[ "${_itw_v:-0}" -ge 9 ] && ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS @/usr/share/icedtea-web/itw-modularjdk.args"
# SecurityManager: opt-in needed on 18-23; 24+ refuses the flag
[ "${_itw_v:-0}" -ge 18 ] && [ "$_itw_v" -le 23 ] && ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS -Djava.security.manager=allow"
unset _itw_v
# splash as in the upstream launchers: off with ICEDTEA_WEB_SPLASH set, -headless or -Xnosplash
if [ -z "$ICEDTEA_WEB_SPLASH" ] && [[ ! " $* " =~ \ -+(headless|Xnosplash) ]] ; then
  ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS -splash:/usr/share/icedtea-web/javaws_splash.png"
fi
# -J<flag> goes to the JVM: ITW relaunches itself this way for JNLP java-vm-args
_itw_args=()
for _itw_a in "$@" ; do
  case "$_itw_a" in
    -J*) ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS ${_itw_a#-J}" ;;
    *) _itw_args+=("$_itw_a") ;;
  esac
done
set -- "${_itw_args[@]}"
unset _itw_a _itw_args
