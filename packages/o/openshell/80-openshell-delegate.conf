# systemd drop-in for user@.service: cgroup controller delegation
#
# Rootless podman needs the cpu, memory and pids controllers in the user's
# cgroup subtree. The OpenShell Podman driver sets a CPU quota, a memory
# limit and a pids limit on every sandbox container, so without them
# "openshell sandbox create" fails with an error such as
# "memory.swap.max: no such file or directory".
#
# SUSE delegates no controller to user sessions by default
# (/usr/lib/systemd/system/user@.service.d/20-defaults-SUSE.conf, for
# performance reasons). This file restores the upstream systemd default for
# every user manager on the host. It is shipped as an example only; the
# administrator decides whether to activate it:
#
#   install -D -m 0644 /usr/share/openshell-gateway/80-openshell-delegate.conf \
#       /etc/systemd/system/user@.service.d/80-openshell-delegate.conf
#   systemctl daemon-reload
#
# then, as the user who runs the gateway:
#
#   systemctl --user daemon-reexec
#   cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers
#
# The last command must list cpu, memory and pids. To limit the change to
# the gateway user, install the file under
# /etc/systemd/system/user@<UID>.service.d/ instead.

[Service]
Delegate=pids memory cpu
