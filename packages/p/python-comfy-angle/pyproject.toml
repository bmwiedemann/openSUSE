[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-angle"
version = "0.1.1"
description = "Mesa/libglvnd-backed implementation of the comfy-angle 0.1.1 API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "openSUSE contributors"},
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/Comfy-Org/comfy-angle"

[tool.setuptools]
packages = ["comfy_angle"]
