[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-vec"
version = "0.1.9"
description = "A vector search SQLite extension."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.9"
authors = [{name = "Alex Garcia"}]
urls = {Homepage = "https://github.com/asg017/sqlite-vec"}

[tool.setuptools]
packages = ["sqlite_vec"]
include-package-data = false

[tool.setuptools.package-data]
sqlite_vec = ["vec0.so"]
